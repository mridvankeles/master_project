# Reproducible data pipeline.
#
#     dvc repro          # rebuild whatever is stale
#     dvc push           # send data/dior_hbb to the local remote (../dvcstore)
#
# CAVEAT worth knowing: the source imagery lives OUTSIDE this repo (see
# configs/paths.yaml), so DVC hashes the derived corpus but cannot hash the
# release it came from. `scripts/check_pairing.py` is what guards against the
# release changing underneath you — run it (via `make data`) before trusting a
# `dvc repro` that reports everything up to date.
#
# check_pairing is deliberately NOT a stage here. It is a guard that exits
# non-zero on a structural surprise, and a guard that halts `dvc repro` is a
# guard people delete.

stages:
  recover_ids:
    cmd: python scripts/recover_ids.py
    desc: >
      Recover DIOR ids and haze severities for the renumbered train/ and val/
      subtrees by decoded-pixel hash against the clear DIOR release. Lifts the
      fog condition from 2,607 ids to ~23,385. Costs ~25 minutes, which is why
      the mapping is a cached artefact rather than part of `prepare`.
    deps:
      - configs/paths.yaml
      - scripts/recover_ids.py
      - src/data/recovery.py
    outs:
      - data/hazy_dior_id_map.json

  prepare:
    cmd: python scripts/prepare_dataset.py
    desc: >
      Convert DIOR HBB annotations to Ultralytics format and materialise the
      clear/fog corpus over the 2,607 DIOR-ID-aligned images. Splits come from
      ImageSets/Main, never from the release's directory names.
    deps:
      - configs/paths.yaml
      - scripts/prepare_dataset.py
      - src/data/build_dataset.py
      - src/data/dior_classes.py
      - src/data/pairing.py
      - src/data/voc_hbb.py
    outs:
      - data/dior_hbb

  prepare_full:
    cmd: python scripts/prepare_dataset.py --scope full
    desc: >
      The same conversion over ALL 23,463 DIOR ids: clear from the official DIOR
      release, fog from the release's test/ subtree plus the recovered train/
      and val/ subtrees. This is the corpus Gate 1 and the interference matrix
      run on; `prepare` above remains the 2,607-id build the early results used.
    deps:
      - configs/paths.yaml
      - scripts/prepare_dataset.py
      - src/data/build_dataset.py
      - src/data/dior_classes.py
      - src/data/pairing.py
      - src/data/recovery.py
      - src/data/voc_hbb.py
      - data/hazy_dior_id_map.json
    outs:
      - data/dior_hbb_full

  verify:
    cmd: python scripts/render_verification.py
    desc: >
      Draw converted boxes back onto the images. The output is for human
      inspection — boxes must sit ON the objects.
    deps:
      - data/dior_hbb
      - scripts/render_verification.py
      - src/data/voc_hbb.py
    # No `outs`. The renders are disposable artefacts for a human to look at,
    # they live under the gitignored outputs/, and declaring them would make DVC
    # either cache a few MB of JPEGs for no reason or demand they be git-tracked.
    # The cost is that this stage always re-runs, which is what we want anyway.
    always_changed: true
