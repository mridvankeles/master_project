# YOLO11 detection (HBB, 20-class DIOR) with a TWO-EXPERT MoE block at the P3 neck stage feeding the small-object head (replaces C3k2 at index 16).
#
# Identical to configs/model/yolo11_dior_hbb.yaml except for the single MoEBlock
# line marked below. Two experts (clear / fog), image-level top-1 hard routing,
# heterogeneous kernels (3x3, 5x5), residual and zero-initialised so insertion
# into a pretrained network is an exact identity at step 0.
#
# Layer indices are load-bearing -- Concat and Detect reference them by number.
# The MoE block is therefore APPENDED IN PLACE of nothing: it replaces the
# module at its index rather than being inserted, so no index shifts.
#
# ARCHITECTURALLY IDENTICAL to Ultralytics' stock `yolo11.yaml`. The only change
# is `nc: 80 -> 20`. Nothing is added, removed or reordered, so this is still the
# stock model per the standing rule — it is copied into the repo purely so the
# MoE block has a version-controlled file to land in later, instead of us editing
# a file inside the pip-installed Ultralytics clone (which `git checkout` would
# silently revert).
#
# WHEN THE MoE ARRIVES (not now — see 04-method-open-questions.md open question 1)
# the recommendation there is expert branches as a BLOCK inside one shared
# network, gated on the incoming feature map, placed deep rather than early.
# That means replacing exactly one line below — the C2PSA at index 10, end of
# backbone — or one of the neck C3k2 stages, and adding the module to
# ultralytics/nn/modules/__init__.py plus a branch in parse_model(). Layer
# indices are load-bearing: `Concat` and `Detect` reference them by number, so
# any insertion that shifts indices must update lines 12, 15, 18, 21 and 24.
#
# Box representation is horizontal (`Detect`, not `OBB`), per 03-datasets.md.

# Parameters
nc: 20 # DIOR classes — order fixed by src/data/dior_classes.py
scales: # `model=yolo11n.yaml` selects scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # 181 layers, 2624080 parameters, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # 181 layers, 9458752 parameters, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # 231 layers, 20114688 parameters, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # 357 layers, 25372160 parameters, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # 357 layers, 56966176 parameters, 196.0 GFLOPs

# backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10  <-- candidate MoE insertion point (deepest backbone stage)

# head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 1, MoEBlock, [256, 2]] # 16 (P3/8-small)  MoE at the small-object neck level

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
