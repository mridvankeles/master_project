# YOLO11 (HBB, 20-class DIOR) with a HETEROGENEOUS-ARCHITECTURE MoE block — design 3.
#
# Design 2 (`yolo11_dior_hbb_cond3.yaml`) put one architecture behind three
# different fixed priors. `scripts/expert_intervention.py` measured the result:
# switching EVERY expert off changed mAP by 0.001 on every condition, and
# forcing the wrong expert cost nothing. The branches were inert, for two
# measured reasons -- their output was 10-21% of the always-on path and was then
# scaled by the gate probability, and a search over 36 fixed priors showed the
# whole prior space differs by 0.04 of CKA.
#
# Four changes here, each aimed at one of those:
#   arch='hetero'    per-degradation ARCHITECTURES, not per-degradation prefixes:
#                    fog is an encoder-decoder with a global airlight vector,
#                    night is illumination-invariance plus contrast attention,
#                    clear is a plain conv. See src/models/experts3.py.
#   hard_mask=True   straight-through selection, so a selected branch runs at
#                    full strength instead of at p. Decouples magnitude from
#                    confidence; the gate still gets gradient through p.
#   rich_proj=True   the always-on projection becomes a 3x3+1x1 context branch,
#                    and is fed INTO every expert. That puts each branch one 1x1
#                    from the block output instead of behind a bottleneck.
#   init_gain=0.1    branches start small but NOT at zero. At exactly zero the
#                    gate receives no gradient at all from the detection loss
#                    (measured: 0.0), because d(out)/d(p_i) = expert_i(x) = 0.
#
# Layer indices are unchanged, so Concat and Detect still reference 13/16/19/22.

# Parameters
nc: 20 # DIOR classes — order fixed by src/data/dior_classes.py
scales: # `model=yolo11n.yaml` selects scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # 181 layers, 2624080 parameters, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # 181 layers, 9458752 parameters, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # 231 layers, 20114688 parameters, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # 357 layers, 25372160 parameters, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # 357 layers, 56966176 parameters, 196.0 GFLOPs

# backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10  <-- candidate MoE insertion point (deepest backbone stage)

# head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  # args: c2, experts, shared, noise_std, threshold, top1, bottleneck,
  #       arch, hard_mask, rich_proj, init_gain
  - [-1, 1, CondMoEBlock, [256, ['clear','fog','night'], True, 0.5, 0.5, False, 0.5, 'hetero', True, True, 0.1]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
