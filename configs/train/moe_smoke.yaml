# Two-epoch smoke test of the MoE training path. Proves the loop runs.
#
# MoE arm. IDENTICAL to configs/train/union_full_yolo11n.yaml in every training
# hyperparameter -- same data, same epochs, same batch, same schedule, same
# seed, same pretrained weights. The ONLY differences are the model yaml (which
# swaps one block for MoEBlock) and the `moe:` section below.
#
# It trains on the `union` condition because a router needs both conditions to
# route between; comparing it against union_full_yolo11n is therefore a
# like-for-like dense-vs-routed comparison on identical data.

run_name: moe_smoke
experiment: dior-hbb-full
condition: union
scope: full
seed: 0

model: configs/model/yolo11_dior_hbb_moe_backbone.yaml
scale: n

train:
  epochs: 2
  imgsz: 640
  batch: 16
  device: 0
  workers: 8
  optimizer: auto
  patience: 30
  cos_lr: true
  pretrained: yolo11n.pt
  val: true
  plots: true
  save_period: -1
  deterministic: true

subset:
  train: 200
  val: 100

moe:
  experts: 2          # clear / fog. No low-light expert in this scope.
  placement: backbone
  aux: entropy        # 04-method-open-questions.md: switch-loss failed to stop
                      # dying experts where an entropy term did.
  lambda: 0.01        # 06-moe-design-guide.md 3.3 starting value
