# DESIGN 3 — heterogeneous expert architectures + paired restoration supervision.
#
# The question this run answers is NOT "is mAP higher". It is:
#
#   does switching the experts off still cost nothing?
#
# `scripts/expert_intervention.py` on design 2 gave a spread of 0.0011-0.0017
# mAP across six routing policies, including "every expert off". The block was a
# dense model with an expensive unused branch. Everything below exists to change
# that one number, and the intervention is re-run afterwards to check.
#
# Judge in this order:
#   1. intervention spread -- do the experts do anything at all?
#   2. restore_loss curve  -- did the fog branch learn to reproduce clear features?
#   3. routing (NMI, purity) -- unchanged from cond3d, hopefully
#   4. mAP -- last, and inside the seed-noise floor we have still not measured

run_name: cond3h_hetero_yolo11n
experiment: dior-hbb-full
condition: union3b
scope: full
seed: 0

model: configs/model/yolo11_dior_hbb_cond3h.yaml
scale: n

train:
  epochs: 60
  imgsz: 640
  batch: 16
  device: 0
  workers: 8
  optimizer: auto
  patience: 60
  cos_lr: true

  # --- AUGMENTATION -----------------------------------------------------
  # Photometric augmentation kept, but bounded. From the measured HSV channel
  # means (docs/pipeline-and-data-audit.md), RandomHSV multiplies by U(1-g,1+g),
  # so the conditions stay separated while
  #     hsv_v < 0.210   (binding pair clear <-> fog2 on brightness)
  #     hsv_s < 0.154   (binding pair clear <-> night on saturation)
  # cond3e zeroed both, which threw away real regularisation for no reason.
  hsv_h: 0.015
  hsv_s: 0.12
  hsv_v: 0.15
  # MOSAIC MUST STAY 0. Beyond the label-corruption reason, paired restoration
  # depends on the clear twin receiving the same geometric augmentation, and a
  # mosaic twin would draw three further random images.
  mosaic: 0.0
  scale: 0.5
  translate: 0.1
  fliplr: 0.5

  pretrained: yolo11n.pt
  val: true
  plots: true
  save_period: -1
  deterministic: true

subset:
  train: 5862
  val: 2000

gate:
  lambda: 1.0
  floor_lambda: 0.5
  floor_tau: 0.6
  count_lambda: 0.0
  pos_weight: 1.0

restore:
  # THE VERIFICATION MECHANISM. clear_00042 / fog2_00042 / night_00042 are the
  # same scene with identical labels, so the corpus is a paired restoration
  # dataset. The fog branch is told directly: produce what the block would have
  # produced for the clear twin of this exact scene.
  #
  #   L = SmoothL1( block_out(degraded), block_out(clear_twin).detach() )
  #
  # Applied only to fog/night samples. This is dehazing and light-invariance with
  # ground truth, and it gives the experts an objective the always-on branch
  # cannot absorb -- which is the mechanism that made design 2's experts inert.
  lambda: 1.0
  beta: 0.1
