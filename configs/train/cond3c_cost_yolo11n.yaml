# Static experts (clear/fog/night) + always-on shared branch + SUPERVISED multi-label gate.
#
# Acceptance criteria BEFORE accuracy is looked at (analyse_routing.py):
#   NMI(route ; condition) > 0, inter-expert CKA < 1, route not concentrated.
# Matched to its control in every training hyperparameter: same data, epochs,
# batch, schedule, seed and pretrained weights. Only the lines noted below differ.

run_name: cond3c_cost_yolo11n
experiment: dior-hbb-full
condition: union3b
scope: full
seed: 0

model: configs/model/yolo11_dior_hbb_cond3.yaml
scale: n

train:
  epochs: 100
  imgsz: 640
  batch: 16
  device: 0
  workers: 8
  optimizer: auto
  patience: 30
  cos_lr: true
  pretrained: yolo11n.pt
  val: true
  plots: true
  save_period: -1
  deterministic: true

subset:
  train: 5862
  val: 2000
gate:
  lambda: 1.0
  # ROUTING COST. Two calibration terms, both aimed at the measured failure:
  # the gate ranks correctly but only reaches p=0.336, so at threshold 0.5 just
  # 0.466 experts fire per image and most images reach no specialist at all.
  #
  # pos_weight  rebalances the BCE. With 3 outputs and typically 1 positive, two
  #             thirds of every target is zero and BCE is minimised by
  #             predicting low. 2.0 = (n_experts - 1).
  # count_lambda charges |sum(p) - n_true|: a COVERAGE cost when too few experts
  #             fire, a SPARSITY cost when too many do. n_true comes from the
  #             same free filename labels, so a compound image is allowed two.
  pos_weight: 2.0
  count_lambda: 0.5
