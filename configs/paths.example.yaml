# Template. Copy to configs/paths.yaml and edit the one path below.
#
# `hazy_dior_root` must directly contain:
#     Annotations/Horizontal Bounding Boxes/
#     ImageSets/Main/{train,val,test}.txt
#     Hazy-DIOR/test/{gt,haze}/{thin,moderate,thick}/
#
# The release nests a second `Hazy-DIOR/` inside the first; point at the OUTER one.
hazy_dior_root: /path/to/Hazy-DIOR

# `dior_root` is the official DIOR release, and must directly contain:
#     JPEGImages-trainval/
#     JPEGImages-test/
#     Annotations/{Horizontal,Oriented} Bounding Boxes/
#     ImageSets/Main/
#
# Optional. Hazy-DIOR carries clear imagery for only the 2,607 aligned ids, so
# this is what makes `--scope full` (all 23,463) possible.
dior_root: /path/to/DIOR
